
[course]
name = "TDDE83"
display_name = "TDDE83 – Programmering i Python, fortsättningskurs"
# Sätts explicit i stället för att lita på parserns ifyllnad: det här är den
# värd studentens OAuth-token skickas till, och ett fält med den innebörden
# ska stå skrivet på ytan och inte härledas.
gitlab_url = "https://gitlab.liu.se"
# Mallens projekt-id (python-d-u/tdde83-student-base), som i TDDE82:s
# handin.toml: verktyget varnar (med bekräftelse) när origin inte är en fork
# av mallen. Id och inte sökväg, eftersom studenter döper om sina forkar.
upstream_project_id = 59415
language = "sv"

[auth]
oauth_client_id = "206eec78350dc7e65dda7b942b6502124c87dc1bc3c5d1dbd2e9398e7d784a02"
token_cache_dir = "~/.config/handin"

[defaults]
target_project_id = 60014

confidential = true
check_existing = true
labels = []

# Policy, inte en kodswitch: verktyget skickar aldrig assignee_ids självt.
partner_assignee = "bot"

bot_active = false

labels_set_later = true

template_project = "python-d-u/tdde83-student-base"


config_update_url = "https://python-d-u.gitlab-pages.liu.se/course-docs/guider/handin-tdde83.toml"

# Tomt = deadlines läses ur [[deadline]] nedan.
deadlines_url = ""

min_script_version = "2.16.0"

[defaults.code]
check_uncommitted = true
require_push = true

check_analysis = false
# Kurserna har inget valideringsskript. Sätts explicit till tomt i stället för
# att ärva parserns default "bin/validate-handin": fältet pekar ut något som
# KÖRS i studentens repo, och ett sådant fält ska aldrig ha ett värde som
# kommit dit av sig självt.
validation_script = ""

[confirmation]
enabled = true


rules_url = "https://python-d-u.gitlab-pages.liu.se/course-docs/guider/ai-assistenten/#7-bekräftelse-vid-inlämning"

# Tom lista = verktygets inbyggda svenska ordpool (20 ord), vald för att vara
# ASCII-only. En egen lista här skulle behöva samma egenskap.
words = []

# En felskrivning får aldrig kosta en inlämning. Samma budget gäller följd-
# frågan på nej-vägen.
attempts = 3



[[handin]]
id = "lab-b1"
required_paths = ["lab-b1/logic.py", "lab-b1/main.py", "lab-b1/registreringar.txt", "lab-b1/pyproject.toml", "lab-b1/uv.lock"]
name = "Labb B1"
type = "code"
labels = ["type::lab-b1"]
group_submission = true
max_group_size = 2

    [handin.lint]
    checks = [
        { name = "Typannoteringar (råd)", command = "{python} check_submission.py lab-b1 --types", required = false, unavailable_exit_codes = [2], advisory = true },
        { name = "Ruff (råd)", command = "cd lab-b1 && uv run --frozen ruff check --config ../ruff.toml .", required = false, advisory = true },
        { name = "Ofärdiga kroppar (råd)", command = "{python} check_submission.py lab-b1 --stubs", required = false, unavailable_exit_codes = [2], advisory = true },
        { name = "Doctest", command = "cd lab-b1 && uv run --frozen python -m doctest logic.py", required = false },
    ]

    [handin.checklist]
    items = [
        { question = "Har ni fått er redovisning godkänd av en handledare?", stop_on_no = true },
    ]

